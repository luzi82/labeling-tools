<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labeling Tools</title>
  <style>
    html, body {
      min-height: 100%;
    }

    body {
      display: grid;
      grid-template-columns: minmax(11rem, 16rem) minmax(0, 1fr);
      margin: 0;
      min-height: 100vh;
    }

    .menu-panel {
      background: #fffdf8;
      border-right: 1px solid #cbd7cc;
      box-sizing: border-box;
      color: #17261d;
      display: flex;
      flex-direction: column;
      font-family: Georgia, serif;
      min-height: 100vh;
      padding: 1.25rem;
    }

    .menu-panel__title {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .menu-panel__actions {
      display: grid;
      gap: .75rem;
      margin-top: 2rem;
    }

    .menu-panel__logout {
      margin-top: auto;
    }

    .menu-panel button {
      background: none;
      border: 1px solid #1e6245;
      border-radius: 4px;
      color: #1e6245;
      cursor: pointer;
      font: inherit;
      padding: .5rem .75rem;
      width: 100%;
    }

    .grid-space {
      background-color: #f7faf8;
      background-image:
        linear-gradient(#d8e2da 1px, transparent 1px),
        linear-gradient(90deg, #d8e2da 1px, transparent 1px);
      background-size: 24px 24px;
      cursor: grab;
      overflow: hidden;
      position: relative;
      min-height: 100vh;
      touch-action: none;
      user-select: none;
    }

    .workspace-layer {
      height: 0;
      left: 0;
      position: absolute;
      top: 0;
      transform-origin: 0 0;
      width: 0;
    }

    .folder-tile {
      align-items: center;
      background: #fffdf8;
      border: 1px solid #879b89;
      border-radius: 4px;
      box-shadow: 0 3px 8px #17261d1c;
      box-sizing: border-box;
      cursor: grab;
      display: grid;
      gap: .5rem;
      justify-items: center;
      padding: .65rem;
      position: absolute;
      touch-action: none;
      width: 7rem;
    }

    .folder-tile:active {
      cursor: grabbing;
    }

    .grid-space.is-panning {
      cursor: grabbing;
    }

    .folder-tile__icon {
      background: #d6ad39;
      border: 1px solid #906d15;
      border-radius: 2px;
      height: 2.25rem;
      position: relative;
      width: 3.25rem;
    }

    .folder-tile__icon::before {
      background: #d6ad39;
      border: 1px solid #906d15;
      border-bottom: 0;
      border-radius: 2px 2px 0 0;
      content: "";
      height: .45rem;
      left: .25rem;
      position: absolute;
      top: -.4rem;
      width: 1.4rem;
    }

    .folder-tile__label {
      max-width: 100%;
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-tile__import {
      background: #1e6245;
      border: 0;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      padding: .35rem .55rem;
    }

    .image-tile {
      background: #fffdf8;
      border: 1px solid #879b89;
      box-shadow: 0 3px 8px #17261d1c;
      box-sizing: border-box;
      cursor: grab;
      line-height: 0;
      position: absolute;
      touch-action: none;
    }

    .image-tile:active {
      cursor: grabbing;
    }

    .image-tile img {
      -webkit-user-drag: none;
      display: block;
      height: 100%;
      object-fit: contain;
      width: 100%;
    }

    dialog {
      background: #fffdf8;
      border: 1px solid #cbd7cc;
      border-radius: 8px;
      box-shadow: 0 12px 30px #17261d1c;
      box-sizing: border-box;
      color: #17261d;
      font-family: Georgia, serif;
      padding: 1.5rem;
      width: min(100% - 2rem, 28rem);
    }

    dialog::backdrop {
      background: #17261d52;
    }

    dialog h2 {
      font-size: 1.35rem;
      margin: 0 0 1.5rem;
    }

    dialog label {
      display: block;
      font-weight: bold;
      margin-bottom: .5rem;
    }

    dialog input {
      border: 1px solid #879b89;
      border-radius: 4px;
      box-sizing: border-box;
      font: inherit;
      padding: .6rem;
      width: 100%;
    }

    .dialog-actions {
      display: flex;
      gap: .75rem;
      justify-content: end;
      margin-top: 1.5rem;
    }

    .dialog-actions button {
      background: none;
      border: 1px solid #1e6245;
      border-radius: 4px;
      color: #1e6245;
      cursor: pointer;
      font: inherit;
      padding: .5rem .9rem;
    }

    .dialog-actions button[type="submit"] {
      background: #1e6245;
      color: #fff;
    }
  </style>
</head>
<body>
  <aside class="menu-panel" aria-label="Application menu">
    <span class="menu-panel__title">Labeling Tools</span>
    <div class="menu-panel__actions">
      <button id="add-images-folder-button" type="button">Add images folder</button>
    </div>
    <form class="menu-panel__logout" action="/logout" method="post">
      <button type="submit">Log out</button>
    </form>
  </aside>
  <main class="grid-space" aria-label="Workspace">
    <div class="workspace-layer"></div>
  </main>
  <dialog id="add-images-folder-dialog" aria-labelledby="add-images-folder-title">
    <form method="dialog">
      <h2 id="add-images-folder-title">Add images folder</h2>
      <label for="image-label">Label</label>
      <input autofocus id="image-label" name="label" required type="text">
      <label for="image-folder-path">Path</label>
      <input id="image-folder-path" name="path" required type="text">
      <div class="dialog-actions">
        <button type="button" data-dialog-cancel>Cancel</button>
        <button type="submit">OK</button>
      </div>
    </form>
  </dialog>
  <script>
    const addImagesFolderButton = document.querySelector("#add-images-folder-button");
    const addImagesFolderDialog = document.querySelector("#add-images-folder-dialog");
    const cancelImportButton = document.querySelector("[data-dialog-cancel]");
    const addImagesFolderForm = addImagesFolderDialog.querySelector("form");
    const GRID_SIZE = 24;
    const MIN_WORKSPACE_SCALE = .25;
    const MAX_WORKSPACE_SCALE = 4;
    const ZOOM_FACTOR = 1.1;
    const workspace = document.querySelector(".grid-space");
    const workspaceLayer = document.querySelector(".workspace-layer");
    let workspaceOffsetX = 0;
    let workspaceOffsetY = 0;
    let workspaceScale = 1;

    function applyWorkspaceCamera() {
      workspace.style.backgroundSize = `${GRID_SIZE * workspaceScale}px ${GRID_SIZE * workspaceScale}px`;
      workspace.style.backgroundPosition = `${workspaceOffsetX}px ${workspaceOffsetY}px`;
      workspaceLayer.style.transform = `translate(${workspaceOffsetX}px, ${workspaceOffsetY}px) scale(${workspaceScale})`;
    }

    addImagesFolderButton.addEventListener("click", () => addImagesFolderDialog.showModal());
    cancelImportButton.addEventListener("click", () => addImagesFolderDialog.close());
    addImagesFolderForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const labelInput = addImagesFolderForm.elements.label;
      const pathInput = addImagesFolderForm.elements.path;
      const x = (32 - workspaceOffsetX) / workspaceScale;
      const y = (32 - workspaceOffsetY) / workspaceScale;

      const response = await fetch("/image-folders", {
        body: JSON.stringify({ label: labelInput.value, path: pathInput.value, x, y }),
        headers: { "Content-Type": "application/json" },
        method: "POST",
      });
      if (!response.ok) {
        return;
      }
      const imageFolder = await response.json();

      createFolderTile({ ...imageFolder, label: labelInput.value, path: pathInput.value, x, y });
      addImagesFolderForm.reset();
      addImagesFolderDialog.close();
    });

    async function loadImageFolders() {
      const response = await fetch("/image-folders");
      if (!response.ok) {
        return;
      }
      const imageFolders = await response.json();
      imageFolders.forEach(createFolderTile);
    }

    function createFolderTile(imageFolder) {
      const folderTile = document.createElement("div");
      const folderIcon = document.createElement("span");
      const folderLabel = document.createElement("span");
      const importButton = document.createElement("button");

      folderTile.className = "folder-tile workspace-item";
      folderTile.dataset.uuid = imageFolder.uuid;
      folderTile.dataset.path = imageFolder.path;
      folderTile.style.left = `${imageFolder.x}px`;
      folderTile.style.top = `${imageFolder.y}px`;
      folderTile.setAttribute("role", "group");
      folderTile.setAttribute("aria-label", `Image folder: ${imageFolder.label}`);
      folderIcon.className = "folder-tile__icon";
      folderIcon.setAttribute("aria-hidden", "true");
      folderLabel.className = "folder-tile__label";
      folderLabel.textContent = imageFolder.label;
      importButton.className = "folder-tile__import";
      importButton.type = "button";
      importButton.textContent = "Import";
      importButton.addEventListener("pointerdown", (event) => event.stopPropagation());
      importButton.addEventListener("click", () => importFolderImages(imageFolder.uuid));
      folderTile.append(folderIcon, folderLabel, importButton);
      workspaceLayer.append(folderTile);
    }

    async function importFolderImages(folderId) {
      const response = await fetch(`/image-folders/${folderId}/import`, { method: "POST" });
      if (!response.ok) {
        return;
      }
      const images = await response.json();
      images.forEach((image, index) => createImageTile(folderId, image, index));
    }

    function createImageTile(folderId, image, index) {
      const imageTile = document.createElement("div");
      const imageElement = document.createElement("img");
      const column = index % 4;
      const row = Math.floor(index / 4);

      imageTile.className = "image-tile workspace-item";
      imageTile.style.left = `${192 + column * 400}px`;
      imageTile.style.top = `${32 + row * 400}px`;
      imageTile.style.width = `${image.width}px`;
      imageTile.style.height = `${image.height}px`;
      imageElement.alt = "";
      imageElement.draggable = false;
      imageElement.height = image.height;
      imageElement.src = `/image-folders/${folderId}/images/${encodeURIComponent(image.path)}`;
      imageElement.width = image.width;
      imageTile.append(imageElement);
      workspaceLayer.append(imageTile);
    }

    loadImageFolders();
    applyWorkspaceCamera();

    workspace.addEventListener("wheel", (event) => {
      event.preventDefault();
      if (event.deltaY === 0) {
        return;
      }

      const workspaceBounds = workspace.getBoundingClientRect();
      const cursorX = event.clientX - workspaceBounds.left;
      const cursorY = event.clientY - workspaceBounds.top;
      const worldX = (cursorX - workspaceOffsetX) / workspaceScale;
      const worldY = (cursorY - workspaceOffsetY) / workspaceScale;
      const nextScale = Math.min(
        MAX_WORKSPACE_SCALE,
        Math.max(
          MIN_WORKSPACE_SCALE,
          workspaceScale * (event.deltaY < 0 ? ZOOM_FACTOR : 1 / ZOOM_FACTOR),
        ),
      );
      if (nextScale === workspaceScale) {
        return;
      }

      workspaceScale = nextScale;
      workspaceOffsetX = cursorX - worldX * workspaceScale;
      workspaceOffsetY = cursorY - worldY * workspaceScale;
      applyWorkspaceCamera();
    }, { passive: false });

    let stopWorkspacePointer = null;

    function endWorkspacePointer() {
      if (stopWorkspacePointer === null) {
        return;
      }
      const stop = stopWorkspacePointer;
      stopWorkspacePointer = null;
      stop();
    }

    function listenForWorkspacePointer(pointerId, onMove, onStop) {
      function move(moveEvent) {
        if (moveEvent.pointerId !== pointerId) {
          return;
        }
        if (moveEvent.buttons === 0) {
          stop();
          return;
        }
        onMove(moveEvent);
      }

      function stop(stopEvent) {
        if (stopEvent && stopEvent.pointerId !== undefined && stopEvent.pointerId !== pointerId) {
          return;
        }
        stopWorkspacePointer = null;
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", stop);
        window.removeEventListener("pointercancel", stop);
        window.removeEventListener("blur", stop);
        onStop();
      }

      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", stop);
      window.addEventListener("pointercancel", stop);
      window.addEventListener("blur", stop);
      stopWorkspacePointer = stop;
    }

    workspace.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) {
        return;
      }
      endWorkspacePointer();

      const workspaceItem = event.target.closest(".workspace-item");
      if (!workspaceItem) {
        panWorkspace(event);
        return;
      }

      event.preventDefault();
      const tileBounds = workspaceItem.getBoundingClientRect();
      const pointerOffsetX = (event.clientX - tileBounds.left) / workspaceScale;
      const pointerOffsetY = (event.clientY - tileBounds.top) / workspaceScale;
      try {
        workspaceItem.setPointerCapture(event.pointerId);
      } catch {
      }

      listenForWorkspacePointer(event.pointerId, moveWorkspaceItem, stopMovingWorkspaceItem);

      function moveWorkspaceItem(moveEvent) {
        const workspaceBounds = workspace.getBoundingClientRect();
        const worldX = (moveEvent.clientX - workspaceBounds.left - workspaceOffsetX) / workspaceScale - pointerOffsetX;
        const worldY = (moveEvent.clientY - workspaceBounds.top - workspaceOffsetY) / workspaceScale - pointerOffsetY;

        workspaceItem.style.left = `${worldX}px`;
        workspaceItem.style.top = `${worldY}px`;
      }

      function stopMovingWorkspaceItem() {
        try {
          workspaceItem.releasePointerCapture(event.pointerId);
        } catch {
        }
      }
    });

    function panWorkspace(event) {
      event.preventDefault();
      let previousClientX = event.clientX;
      let previousClientY = event.clientY;

      workspace.classList.add("is-panning");
      try {
        workspace.setPointerCapture(event.pointerId);
      } catch {
      }
      listenForWorkspacePointer(event.pointerId, moveWorkspace, stopPanningWorkspace);

      function moveWorkspace(moveEvent) {
        workspaceOffsetX += moveEvent.clientX - previousClientX;
        workspaceOffsetY += moveEvent.clientY - previousClientY;
        applyWorkspaceCamera();
        previousClientX = moveEvent.clientX;
        previousClientY = moveEvent.clientY;
      }

      function stopPanningWorkspace() {
        workspace.classList.remove("is-panning");
        try {
          workspace.releasePointerCapture(event.pointerId);
        } catch {
        }
      }
    }
  </script>
</body>
</html>
