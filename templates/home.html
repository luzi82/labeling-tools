<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labeling Tools</title>
  <style>
    html, body {
      min-height: 100%;
    }

    body {
      display: grid;
      grid-template-columns: minmax(11rem, 16rem) minmax(0, 1fr);
      margin: 0;
      min-height: 100vh;
    }

    .menu-panel {
      background: #fffdf8;
      border-right: 1px solid #cbd7cc;
      box-sizing: border-box;
      color: #17261d;
      display: flex;
      flex-direction: column;
      font-family: Georgia, serif;
      min-height: 100vh;
      padding: 1.25rem;
    }

    .menu-panel__title {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .menu-panel__actions {
      display: grid;
      gap: .75rem;
      margin-top: 2rem;
    }

    .menu-panel__logout {
      margin-top: auto;
    }

    .menu-panel button {
      background: none;
      border: 1px solid #1e6245;
      border-radius: 4px;
      color: #1e6245;
      cursor: pointer;
      font: inherit;
      padding: .5rem .75rem;
      width: 100%;
    }

    .grid-space {
      background-color: #f7faf8;
      background-image:
        linear-gradient(#d8e2da 1px, transparent 1px),
        linear-gradient(90deg, #d8e2da 1px, transparent 1px);
      background-size: 24px 24px;
      min-height: 100vh;
    }

    dialog {
      background: #fffdf8;
      border: 1px solid #cbd7cc;
      border-radius: 8px;
      box-shadow: 0 12px 30px #17261d1c;
      box-sizing: border-box;
      color: #17261d;
      font-family: Georgia, serif;
      padding: 1.5rem;
      width: min(100% - 2rem, 28rem);
    }

    dialog::backdrop {
      background: #17261d52;
    }

    dialog h2 {
      font-size: 1.35rem;
      margin: 0 0 1.5rem;
    }

    dialog label {
      display: block;
      font-weight: bold;
      margin-bottom: .5rem;
    }

    dialog input {
      border: 1px solid #879b89;
      border-radius: 4px;
      box-sizing: border-box;
      font: inherit;
      padding: .6rem;
      width: 100%;
    }

    .dialog-actions {
      display: flex;
      gap: .75rem;
      justify-content: end;
      margin-top: 1.5rem;
    }

    .dialog-actions button {
      background: none;
      border: 1px solid #1e6245;
      border-radius: 4px;
      color: #1e6245;
      cursor: pointer;
      font: inherit;
      padding: .5rem .9rem;
    }

    .dialog-actions button[type="submit"] {
      background: #1e6245;
      color: #fff;
    }
  </style>
</head>
<body>
  <aside class="menu-panel" aria-label="Application menu">
    <span class="menu-panel__title">Labeling Tools</span>
    <div class="menu-panel__actions">
      <button id="import-images-button" type="button">Import images</button>
    </div>
    <form class="menu-panel__logout" action="/logout" method="post">
      <button type="submit">Log out</button>
    </form>
  </aside>
  <main class="grid-space" aria-label="Workspace"></main>
  <dialog id="import-images-dialog" aria-labelledby="import-images-title">
    <form method="dialog">
      <h2 id="import-images-title">Import images</h2>
      <label for="image-label">Label</label>
      <input autofocus id="image-label" name="label" required type="text">
      <label for="image-path">Path</label>
      <input id="image-path" name="path" required type="text">
      <div class="dialog-actions">
        <button type="button" data-dialog-cancel>Cancel</button>
        <button type="submit">OK</button>
      </div>
    </form>
  </dialog>
  <script>
    const importImagesButton = document.querySelector("#import-images-button");
    const importImagesDialog = document.querySelector("#import-images-dialog");
    const cancelImportButton = document.querySelector("[data-dialog-cancel]");

    importImagesButton.addEventListener("click", () => importImagesDialog.showModal());
    cancelImportButton.addEventListener("click", () => importImagesDialog.close());
  </script>
</body>
</html>
