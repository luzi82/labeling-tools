<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labeling Tools</title>
  <style>
    html, body {
      min-height: 100%;
    }

    body {
      display: grid;
      grid-template-columns: minmax(11rem, 16rem) minmax(0, 1fr);
      margin: 0;
      min-height: 100vh;
    }

    .menu-panel {
      background: #fffdf8;
      border-right: 1px solid #cbd7cc;
      box-sizing: border-box;
      color: #17261d;
      display: flex;
      flex-direction: column;
      font-family: Georgia, serif;
      min-height: 100vh;
      padding: 1.25rem;
    }

    .menu-panel__title {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .menu-panel form {
      margin-top: auto;
    }

    .menu-panel button {
      background: none;
      border: 1px solid #1e6245;
      border-radius: 4px;
      color: #1e6245;
      cursor: pointer;
      font: inherit;
      padding: .5rem .75rem;
      width: 100%;
    }

    .grid-space {
      background-color: #f7faf8;
      background-image:
        linear-gradient(#d8e2da 1px, transparent 1px),
        linear-gradient(90deg, #d8e2da 1px, transparent 1px);
      background-size: 24px 24px;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <aside class="menu-panel" aria-label="Application menu">
    <span class="menu-panel__title">Labeling Tools</span>
    <form action="/logout" method="post">
      <button type="submit">Log out</button>
    </form>
  </aside>
  <main class="grid-space" aria-label="Workspace"></main>
</body>
</html>
