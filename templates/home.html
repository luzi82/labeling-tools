<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labeling Tools</title>
  <style>
    html, body {
      min-height: 100%;
    }

    body {
      display: grid;
      grid-template-columns: minmax(11rem, 16rem) minmax(0, 1fr);
      margin: 0;
      min-height: 100vh;
    }

    .menu-panel {
      background: #fffdf8;
      border-right: 1px solid #cbd7cc;
      box-sizing: border-box;
      color: #17261d;
      display: flex;
      flex-direction: column;
      font-family: Georgia, serif;
      min-height: 100vh;
      padding: 1.25rem;
    }

    .menu-panel__title {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .menu-panel__actions {
      display: grid;
      gap: .75rem;
      margin-top: 2rem;
    }

    .menu-panel__logout {
      margin-top: auto;
    }

    .menu-panel button {
      background: none;
      border: 1px solid #1e6245;
      border-radius: 4px;
      color: #1e6245;
      cursor: pointer;
      font: inherit;
      padding: .5rem .75rem;
      width: 100%;
    }

    .grid-space {
      background-color: #f7faf8;
      background-image:
        linear-gradient(#d8e2da 1px, transparent 1px),
        linear-gradient(90deg, #d8e2da 1px, transparent 1px);
      background-size: 24px 24px;
      cursor: grab;
      overflow: hidden;
      position: relative;
      min-height: 100vh;
    }

    .folder-tile {
      align-items: center;
      background: #fffdf8;
      border: 1px solid #879b89;
      border-radius: 4px;
      box-shadow: 0 3px 8px #17261d1c;
      box-sizing: border-box;
      cursor: grab;
      display: grid;
      gap: .5rem;
      justify-items: center;
      padding: .65rem;
      position: absolute;
      touch-action: none;
      width: 7rem;
    }

    .folder-tile:active {
      cursor: grabbing;
    }

    .grid-space.is-panning {
      cursor: grabbing;
    }

    .folder-tile__icon {
      background: #d6ad39;
      border: 1px solid #906d15;
      border-radius: 2px;
      height: 2.25rem;
      position: relative;
      width: 3.25rem;
    }

    .folder-tile__icon::before {
      background: #d6ad39;
      border: 1px solid #906d15;
      border-bottom: 0;
      border-radius: 2px 2px 0 0;
      content: "";
      height: .45rem;
      left: .25rem;
      position: absolute;
      top: -.4rem;
      width: 1.4rem;
    }

    .folder-tile__label {
      max-width: 100%;
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    dialog {
      background: #fffdf8;
      border: 1px solid #cbd7cc;
      border-radius: 8px;
      box-shadow: 0 12px 30px #17261d1c;
      box-sizing: border-box;
      color: #17261d;
      font-family: Georgia, serif;
      padding: 1.5rem;
      width: min(100% - 2rem, 28rem);
    }

    dialog::backdrop {
      background: #17261d52;
    }

    dialog h2 {
      font-size: 1.35rem;
      margin: 0 0 1.5rem;
    }

    dialog label {
      display: block;
      font-weight: bold;
      margin-bottom: .5rem;
    }

    dialog input {
      border: 1px solid #879b89;
      border-radius: 4px;
      box-sizing: border-box;
      font: inherit;
      padding: .6rem;
      width: 100%;
    }

    .dialog-actions {
      display: flex;
      gap: .75rem;
      justify-content: end;
      margin-top: 1.5rem;
    }

    .dialog-actions button {
      background: none;
      border: 1px solid #1e6245;
      border-radius: 4px;
      color: #1e6245;
      cursor: pointer;
      font: inherit;
      padding: .5rem .9rem;
    }

    .dialog-actions button[type="submit"] {
      background: #1e6245;
      color: #fff;
    }
  </style>
</head>
<body>
  <aside class="menu-panel" aria-label="Application menu">
    <span class="menu-panel__title">Labeling Tools</span>
    <div class="menu-panel__actions">
      <button id="add-images-folder-button" type="button">Add images folder</button>
    </div>
    <form class="menu-panel__logout" action="/logout" method="post">
      <button type="submit">Log out</button>
    </form>
  </aside>
  <main class="grid-space" aria-label="Workspace"></main>
  <dialog id="add-images-folder-dialog" aria-labelledby="add-images-folder-title">
    <form method="dialog">
      <h2 id="add-images-folder-title">Add images folder</h2>
      <label for="image-label">Label</label>
      <input autofocus id="image-label" name="label" required type="text">
      <label for="image-folder-path">Path</label>
      <input id="image-folder-path" name="path" required type="text">
      <div class="dialog-actions">
        <button type="button" data-dialog-cancel>Cancel</button>
        <button type="submit">OK</button>
      </div>
    </form>
  </dialog>
  <script>
    const addImagesFolderButton = document.querySelector("#add-images-folder-button");
    const addImagesFolderDialog = document.querySelector("#add-images-folder-dialog");
    const cancelImportButton = document.querySelector("[data-dialog-cancel]");
    const addImagesFolderForm = addImagesFolderDialog.querySelector("form");
    const workspace = document.querySelector(".grid-space");
    let workspaceOffsetX = 0;
    let workspaceOffsetY = 0;

    addImagesFolderButton.addEventListener("click", () => addImagesFolderDialog.showModal());
    cancelImportButton.addEventListener("click", () => addImagesFolderDialog.close());
    addImagesFolderForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const labelInput = addImagesFolderForm.elements.label;
      const pathInput = addImagesFolderForm.elements.path;
      const x = 32;
      const y = 32;

      const response = await fetch("/image-folders", {
        body: JSON.stringify({ label: labelInput.value, path: pathInput.value, x, y }),
        headers: { "Content-Type": "application/json" },
        method: "POST",
      });
      if (!response.ok) {
        return;
      }
      const imageFolder = await response.json();

      createFolderTile({ ...imageFolder, label: labelInput.value, path: pathInput.value, x, y });
      addImagesFolderForm.reset();
      addImagesFolderDialog.close();
    });

    async function loadImageFolders() {
      const response = await fetch("/image-folders");
      if (!response.ok) {
        return;
      }
      const imageFolders = await response.json();
      imageFolders.forEach(createFolderTile);
    }

    function createFolderTile(imageFolder) {
      const folderTile = document.createElement("div");
      const folderIcon = document.createElement("span");
      const folderLabel = document.createElement("span");

      folderTile.className = "folder-tile";
      folderTile.dataset.uuid = imageFolder.uuid;
      folderTile.dataset.path = imageFolder.path;
      folderTile.style.left = `${imageFolder.x}px`;
      folderTile.style.top = `${imageFolder.y}px`;
      folderTile.setAttribute("role", "group");
      folderTile.setAttribute("aria-label", `Image folder: ${imageFolder.label}`);
      folderIcon.className = "folder-tile__icon";
      folderIcon.setAttribute("aria-hidden", "true");
      folderLabel.className = "folder-tile__label";
      folderLabel.textContent = imageFolder.label;
      folderTile.append(folderIcon, folderLabel);
      workspace.append(folderTile);
    }

    loadImageFolders();

    workspace.addEventListener("pointerdown", (event) => {
      const folderTile = event.target.closest(".folder-tile");
      if (!folderTile) {
        panWorkspace(event);
        return;
      }

      const workspaceBounds = workspace.getBoundingClientRect();
      const tileBounds = folderTile.getBoundingClientRect();
      const pointerOffsetX = event.clientX - tileBounds.left;
      const pointerOffsetY = event.clientY - tileBounds.top;

      folderTile.setPointerCapture(event.pointerId);
      folderTile.addEventListener("pointermove", moveFolderTile);
      folderTile.addEventListener("pointerup", stopMovingFolderTile, { once: true });
      folderTile.addEventListener("pointercancel", stopMovingFolderTile, { once: true });

      function moveFolderTile(moveEvent) {
        const maximumLeft = workspaceBounds.width - folderTile.offsetWidth;
        const maximumTop = workspaceBounds.height - folderTile.offsetHeight;
        const left = Math.max(0, Math.min(maximumLeft, moveEvent.clientX - workspaceBounds.left - pointerOffsetX));
        const top = Math.max(0, Math.min(maximumTop, moveEvent.clientY - workspaceBounds.top - pointerOffsetY));

        folderTile.style.left = `${left}px`;
        folderTile.style.top = `${top}px`;
      }

      function stopMovingFolderTile(stopEvent) {
        folderTile.releasePointerCapture(stopEvent.pointerId);
        folderTile.removeEventListener("pointermove", moveFolderTile);
      }
    });

    function panWorkspace(event) {
      let previousClientX = event.clientX;
      let previousClientY = event.clientY;

      workspace.classList.add("is-panning");
      workspace.setPointerCapture(event.pointerId);
      workspace.addEventListener("pointermove", moveWorkspace);
      workspace.addEventListener("pointerup", stopPanningWorkspace, { once: true });
      workspace.addEventListener("pointercancel", stopPanningWorkspace, { once: true });

      function moveWorkspace(moveEvent) {
        const deltaX = moveEvent.clientX - previousClientX;
        const deltaY = moveEvent.clientY - previousClientY;

        workspaceOffsetX += deltaX;
        workspaceOffsetY += deltaY;
        workspace.style.backgroundPosition = `${workspaceOffsetX}px ${workspaceOffsetY}px`;
        workspace.querySelectorAll(".folder-tile").forEach((tile) => {
          tile.style.left = `${tile.offsetLeft + deltaX}px`;
          tile.style.top = `${tile.offsetTop + deltaY}px`;
        });
        previousClientX = moveEvent.clientX;
        previousClientY = moveEvent.clientY;
      }

      function stopPanningWorkspace(stopEvent) {
        workspace.classList.remove("is-panning");
        workspace.releasePointerCapture(stopEvent.pointerId);
        workspace.removeEventListener("pointermove", moveWorkspace);
      }
    }
  </script>
</body>
</html>
